<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>码字 · 打字练习</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Top Navigation -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle" title="菜单">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="logo">
          <span class="logo-icon">键</span>
          <span class="logo-text">码字</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="zoom-controls" id="zoomControls">
          <button class="icon-btn zoom-btn" id="zoomOutBtn" title="缩小（Ctrl+-）">−</button>
          <button class="zoom-percent" id="zoomResetBtn" title="恢复原始大小（Ctrl+0）">100%</button>
          <button class="icon-btn zoom-btn" id="zoomInBtn" title="放大（Ctrl++）">+</button>
        </div>
        <button class="icon-btn" id="themeToggle" title="切换主题">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <!-- Sidebar -->
      <nav class="sidebar" id="sidebar">
        <ul class="nav-list">
          <li class="nav-item active" data-page="home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>首页</span>
          </li>
          <li class="nav-item" data-page="english">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>英文打字</span>
          </li>
          <li class="nav-item" data-page="pinyin">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span>拼音打字</span>
          </li>
          <li class="nav-item" data-page="number">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="7" y1="4" x2="7" y2="20"/><line x1="17" y1="4" x2="17" y2="20"/></svg>
            <span>数字符号</span>
          </li>
          <li class="nav-item" data-page="test">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>打字测试</span>
          </li>
          <li class="nav-item" data-page="game">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>
            <span>打字游戏</span>
          </li>
          <li class="nav-item" data-page="stats">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>统计中心</span>
          </li>
        </ul>
        <div class="sidebar-footer">
          <div class="user-level" id="userLevel">
            <div class="level-badge" id="levelBadge">Lv.1</div>
            <div class="level-info">
              <div class="level-progress-bar"><div class="level-progress-fill" id="levelProgressFill"></div></div>
              <div class="level-text" id="levelText">0 / 100 经验</div>
            </div>
          </div>
        </div>
      </nav>

      <!-- Main Content -->
      <main class="main-content" id="mainContent">
        <!-- Pages rendered dynamically -->
      </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal">
        <div class="modal-header">
          <h2>设置</h2>
          <button class="modal-close" id="settingsClose">&times;</button>
        </div>
        <div class="modal-body">
          <div class="setting-row">
            <label>字体大小</label>
            <div class="setting-control">
              <input type="range" id="fontSizeSlider" min="18" max="48" value="28" step="2">
              <span id="fontSizeValue">28px</span>
            </div>
          </div>
          <div class="setting-row">
            <label>音效</label>
            <div class="setting-control">
              <label class="toggle"><input type="checkbox" id="soundToggle" checked><span class="toggle-slider"></span></label>
            </div>
          </div>
          <div class="setting-row">
            <label>显示悬浮键盘（含指法提示）</label>
            <div class="setting-control">
              <label class="toggle"><input type="checkbox" id="keyboardHintToggle"><span class="toggle-slider"></span></label>
            </div>
          </div>
          <div class="setting-row">
            <label>拼音模糊匹配</label>
            <div class="setting-control">
              <label class="toggle"><input type="checkbox" id="fuzzyToggle"><span class="toggle-slider"></span></label>
            </div>
          </div>
          <div class="setting-row">
            <label>跳过标点符号</label>
            <div class="setting-control">
              <label class="toggle"><input type="checkbox" id="punctFilterToggle"><span class="toggle-slider"></span></label>
            </div>
          </div>
          <div class="setting-row">
            <label>清空所有数据</label>
            <div class="setting-control">
              <button class="btn-danger" id="clearDataBtn">清空</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/pinyin-data.js"></script>
  <script src="js/pinyin-utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/typing-engine.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/hand-svgs.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
